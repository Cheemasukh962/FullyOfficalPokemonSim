<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle Arena</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="battle-container">
        <!-- Decorative pokeballs -->
        <div class="decorative-circle"></div>
        <div class="decorative-circle"></div>
        <div class="decorative-circle"></div>
        <div class="decorative-circle"></div>

        <!-- Header section -->
        <div class="battle-header">
            <h1 class="header-title">POKÉMON BATTLE</h1>
            <div class="status-lights">
                <div class="status-dot"></div>
                <div class="status-dot"></div>
                <div class="status-dot"></div>
            </div>
        </div>

        <!-- Pokemon input section -->
        <div style="width: 100%; max-width: 900px; margin-bottom: 2rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <input type="text" id="pokemon-name-1" placeholder="Enter first Pokémon" 
                    style="padding: 0.75rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 0.5rem; background: rgba(255,255,255,0.1); color: white; font-size: 1rem;">
                <input type="text" id="pokemon-name-2" placeholder="Enter second Pokémon" 
                    style="padding: 0.75rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 0.5rem; background: rgba(255,255,255,0.1); color: white; font-size: 1rem;">
            </div>
            <button id="fetch-both-button" 
                style="width: 100%; padding: 0.75rem; background: linear-gradient(to right, rgb(99, 102, 241), rgb(139, 92, 246)); border: 2px solid rgba(255,255,255,0.3); border-radius: 0.5rem; color: white; font-weight: bold; cursor: pointer; transition: all 0.3s ease;">
                Load Both Pokémon
            </button>
        </div>

        <!-- Pokemon cards grid -->
        <div class="pokemon-grid" id="pokemon-info">
            <div id="poke-1" class="pokemon-card">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
            <div id="poke-2" class="pokemon-card">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>

        <!-- Battle button -->
        <button id="battle-button" class="battle-button">
            <span class="battle-button-icon">⚔️</span>
            BATTLE
            <span class="battle-button-icon">⚔️</span>
        </button>

        <!-- Battle History Section -->
        <div style="width: 100%; max-width: 900px; margin-top: 3rem; padding: 2rem; background: rgba(0, 0, 0, 0.3); border-radius: 1rem; border: 2px solid rgba(255,255,255,0.2);">
            <h2 style="color: white; margin-top: 0; margin-bottom: 1.5rem; text-align: center;">📊 Battle History</h2>
            
            <!-- Recent Battles List -->
            <div id="battle-list" style="max-height: 300px; overflow-y: auto;">
                <!-- Battles will be inserted here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
